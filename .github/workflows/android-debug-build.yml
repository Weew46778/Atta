name: Android debug build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Static health check
        run: python3 tools/static_check.py

      - name: Build debug APK
        run: |
          set +e
          {
            echo "== JAVA =="
            java -version
            echo "== GRADLE =="
            gradle --version || true
            echo "== BUILD =="
            if [[ -x gradlew ]]; then
              ./gradlew assembleDebug --no-daemon --stacktrace
            else
              gradle assembleDebug --no-daemon --stacktrace
            fi
          } 2>&1 | tee /tmp/build.log
          echo "== exit=${PIPESTATUS[0]} =="

      - name: Show build outputs
        if: always()
        run: |
          echo "== build outputs =="
          find app/build/outputs -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo "== build.log tail =="
          tail -40 /tmp/build.log 2>/dev/null || true

      - name: Commit build log for diagnostics
        if: always()
        run: |
          git config user.name "MineAva CI"
          git config user.email "actions@github.com"
          mkdir -p artifacts
          cp /tmp/build.log artifacts/build-log.txt
          git add -f artifacts/build-log.txt
          git commit -m "ci: capture build log [skip ci]" || true
          git push origin HEAD:refs/heads/${{ github.ref_name }} || true

      - name: Upload APK or build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineava-debug-build
          path: |
            app/build/outputs/apk/debug/*.apk
            /tmp/build.log
          if-no-files-found: warn

      - name: Publish APK or diagnostic log to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)"
          if [ -f "$APK" ]; then
            TAG="v0.1.0-build-${{ github.run_number }}"
            ls -lh "$APK"
            gh release create "$TAG" "$APK" \
              --title "MineAva debug APK #${{ github.run_number }}" \
              --notes "Automatic debug build from ${{ github.sha }}. This is an unsigned debug APK for testing." \
              --target "${{ github.sha }}" \
              --repo "$GITHUB_REPOSITORY" \
              || gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            TAG="mineava-build-log-${{ github.run_number }}"
            echo "No APK produced. Publishing diagnostic build log."
            gh release create "$TAG" /tmp/build.log \
              --title "MineAva build log #${{ github.run_number }}" \
              --notes "No APK produced. Build log attached." \
              --target "${{ github.sha }}" \
              --repo "$GITHUB_REPOSITORY" \
              || gh release upload "$TAG" /tmp/build.log --clobber --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets --jq '.tagName, (.assets[] | .name + " " + .url)'
