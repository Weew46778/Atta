name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version
          # generate the wrapper so ./gradlew works for the rest of the build
          cd android && /tmp/gradle-8.7/bin/gradle wrapper

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelcraft-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "pixelcraft-apk-v${{ github.run_number }}"
          name: "PixelCraft Studio APK build #${{ github.run_number }}"
          body: |
            **PixelCraft Studio — Bedrock texture & shader pack generator**

            Automatic debug APK build. Install on an Android device (allow "install from unknown sources").
          files: android/app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
